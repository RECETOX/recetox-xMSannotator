name: recetox-xmsannotator-dev
channels:
  - conda-forge
  - bioconda
dependencies:
  # R base and core development tools
  - r-base >= 4.4              # Updated: align with latest Bioconductor requirements
  - r-devtools >= 2.5.2        # Updated: 2.4.2 -> 2.5.2
  - boost-cpp                  # Version managed by conda-forge
  - r-biocmanager >= 1.30.16   # Unchanged

  # Data manipulation and tidying packages
  - r-plyr >= 1.8.6            # Unchanged: stable version
  - r-wgcna >= 1.74            # Updated: 1.69 -> 1.74
  - r-tidyr >= 1.3.2           # Updated: 1.1.4 -> 1.3.2
  - r-purrr >= 1.2.2           # Updated: 0.3.4 -> 1.2.2
  - r-tibble >= 3.3.1          # Updated: 3.1.5 -> 3.3.1
  - r-dplyr >= 1.2.1           # Updated: 1.0.0 -> 1.2.1
  - r-rcpp >= 1.1.1            # Updated: 0.11.0 -> 1.1.1
  - r-data.table      # Updated: 1.14.2 -> 1.18.4
  - r-stringi >= 1.8.7         # Updated: 1.8.4 -> 1.8.7

  # Testing and documentation
  - r-testthat >= 3.3.2        # Updated: 3.0.0 -> 3.3.2
  - r-covr >= 3.6.5            # Updated: removed <= constraint, 3.5.1 -> 3.6.5

  # Data I/O packages
  - r-arrow >= 24.0.0          # Updated: added specific version
  - r-readr >= 2.2.0           # Updated: 2.0.2 -> 2.2.0

  # Statistical and clustering packages
  - r-flashclust >= 1.1-4      # Updated: 1.01_2 -> 1.1-4
  - r-pastecs >= 1.4.2         # Updated: 1.3.21 -> 1.4.2
  - r-rann >= 2.6.2            # Updated: 2.6.1 -> 2.6.2
  - r-entropy >= 1.3.2         # Updated: 1.3.1 -> 1.3.2
  - r-gplots >= 3.3.0          # Updated: added specific version

  # Chemistry and cheminformatics packages
  - r-rcdk >= 3.8.2            # Updated: 3.5.0 -> 3.8.2
  - bioconductor-rdisop   # Updated: added specific version

  # Utility packages
  - r-rlist >= 0.4.6.2         # Unchanged: stable version
  - r-patrick >= 0.1.0         # Unchanged: version constraint kept
  - r-datacomparer >= 0.1.3    # Unchanged: version constraint kept

  # Interactive R console
  - radian                       # Unchanged
